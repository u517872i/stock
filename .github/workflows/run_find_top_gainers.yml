name: Run find_top_gainers

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2026-07-31'
      end:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2026-08-14'
      top:
        description: 'Top N'
        required: false
        default: '50'
      limit:
        description: 'Limit tickers (0=all)'
        required: false
        default: '0'
      max-workers:
        description: 'Max workers for parallel fetch'
        required: false
        default: '10'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run find_top_gainers
        env:
          START: ${{ github.event.inputs.start || '2026-07-31' }}
          END: ${{ github.event.inputs.end || '2026-08-14' }}
          TOP: ${{ github.event.inputs.top || '50' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          MAX_WORKERS: ${{ github.event.inputs['max-workers'] || '10' }}
        run: |
          mkdir -p results
          echo "Run at: $(date -u)" > results/run_info.txt
          echo "start=${START}, end=${END}, top=${TOP}, limit=${LIMIT}, max_workers=${MAX_WORKERS}" >> results/run_info.txt
          python3 scripts/find_top_gainers.py --start "${START}" --end "${END}" --top "${TOP}" --limit "${LIMIT}" --max-workers "${MAX_WORKERS}" 2>&1 | tee results/output.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: top_gainers_results
          path: results
